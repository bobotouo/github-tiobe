# 在采集成功后，对样本仓库做元数据 + LLM 用途归纳（可选，与 Vercel Cron 分开跑）。
name: Repo enrich (LLM)

on:
  schedule:
    # 比采集略晚，确保当日 run 已写入 DB（按 UTC 调整）
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "run_date (YYYY-MM-DD), default yesterday UTC"
        required: false
        type: string

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Run enrich script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_MODE: ${{ vars.LLM_MODE }}
          ENRICH_MAX_REPOS: ${{ vars.ENRICH_MAX_REPOS }}
          SAMPLE_MAX_REPOS: ${{ vars.SAMPLE_MAX_REPOS }}
          LLM_JSON_OBJECT_FORMAT: ${{ vars.LLM_JSON_OBJECT_FORMAT }}
        run: |
          DATE="${{ github.event.inputs.run_date }}"
          if [ -n "$DATE" ]; then
            npx tsx scripts/enrich-repos-llm.ts --date="$DATE"
          else
            npm run enrich:repos
          fi
